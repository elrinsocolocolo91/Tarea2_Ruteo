services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8
    container_name: resiliencia_chile_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: red_chile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: